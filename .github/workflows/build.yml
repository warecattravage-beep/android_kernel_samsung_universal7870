name: Build Kernel

on:
  push:
    branches: [ lineage-16.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc libssl-dev python3

      - name: Fix dtc yylloc
        run: |
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped

      - name: Fix proc.S
        run: |
          sed -i 's/\.section "\.text\.init", #alloc, #execinstr/.section ".text.init", "ax"/' arch/arm64/mm/proc.S

      - name: Fix init/Makefile
        run: |
          sed -i '/ifeq ($(CONFIG_TIMA_RKP), y)/,/endif/d' init/Makefile

      - name: Build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make exynos7870-gtaxllte_defconfig
          make -j$(nproc) KCFLAGS="-Wno-error"

      - name: Upload Image
        uses: actions/upload-artifact@v3
        with:
          name: kernel-Image
          path: arch/arm64/boot/Image
